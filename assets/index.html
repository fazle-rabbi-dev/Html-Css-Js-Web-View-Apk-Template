<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bhoot FM</title>
<style>
:root{--bg:#0a0a0f;--card:#15151f;--red:#ef4444;--red2:#7f1d1d;--tx:#f5f5f5;--mut:#9ca3af;--line:#262633}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(600px 300px at 50% -60px,#3a0a0a,transparent),var(--bg);color:var(--tx);font-family:system-ui,Roboto,Arial,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:rgba(10,10,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 14px}
h1{margin:0;font-size:20px;letter-spacing:.5px}.sub{color:var(--mut);font-size:12px;margin-top:2px}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font-size:15px;outline:none}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:20px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
#status{padding:14px;color:var(--mut);font-size:13px;text-align:center}
.picker{padding:8px 16px 16px;display:flex;justify-content:center}
.pick-card{width:100%;max-width:320px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 20px}
.pick-icon{display:flex;justify-content:center}
.pick-icon svg{width:56px;height:56px}
.pick-title{font-size:15px;font-weight:700;margin-top:10px}
.pick-sub{font-size:13px;color:var(--mut);margin-top:4px}
.pick-btn{display:inline-block;margin-top:16px;background:var(--red);color:#fff;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer}
.pick-count{font-size:12px;color:var(--mut);margin-top:10px;min-height:16px}
#list{list-style:none;margin:0;padding:0 12px 190px}
#list li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s}
#list li:hover{border-color:var(--red);box-shadow:0 0 14px rgba(239,68,68,.45),0 0 3px rgba(239,68,68,.8);transform:translateY(-1px)}
#list li:active{transform:translateY(0);box-shadow:0 0 10px rgba(239,68,68,.5)}
#list li.playing{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.num{width:30px;height:30px;border-radius:50%;background:#22222f;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
li.playing .num{background:var(--red);color:#fff}
.t{flex:1;min-width:0}.t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.t span{font-size:12px;color:var(--mut)}
.fav{background:none;border:none;font-size:20px;cursor:pointer;color:#555}
.fav.on{color:var(--red)}
#bar{position:fixed;bottom:0;left:0;right:0;background:#101018;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#now{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#time{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;margin-top:2px}
input[type=range]{width:100%;accent-color:var(--red);margin:8px 0 4px}
.ctrls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:4px}
.ctrls button{background:#22222f;border:1px solid var(--line);color:#fff;border-radius:50%;width:46px;height:46px;font-size:19px;cursor:pointer}
.ctrls button.big{background:var(--red);border-color:var(--red);width:60px;height:60px;font-size:24px}
.ctrls button.mini{width:38px;height:38px;font-size:14px}
.ctrls button.on{outline:2px solid var(--red)}
.tools{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px;flex-wrap:wrap}
.tools select,.tools button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.tools label{font-size:12px;color:var(--mut)}
.tools input[type=number]{width:52px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;outline:none}
.picker input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
audio{display:none}
.empty{min-height:40vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);padding:30px;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<header>
<h1><svg viewBox="0 0 24 24" width="20" height="20" style="vertical-align:-3px" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7v11l2.3-1.8L9.6 20l2.4-1.8L12 20l.1-.1L14.4 20l2.3-1.8L19 20V9a7 7 0 0 0-7-7Z" fill="#ef4444"/><circle cx="9.5" cy="10" r="1.4" fill="#0a0a0f"/><circle cx="14.5" cy="10" r="1.4" fill="#0a0a0f"/><ellipse cx="12" cy="13.5" rx="1.6" ry="2" fill="#0a0a0f"/></svg> Bhoot FM</h1>
<div class="search"><input id="q" placeholder="Search episode…"></div>
<div class="row">
<button class="chip on" data-f="all">All</button>
<button class="chip" data-f="fav">♥ Favorites</button>
<button class="chip" id="rescan">⟳ Rescan</button>
</div>
</header>
<div id="status">Loading…</div>
<div class="picker" id="fallback" style="display:none">
<div class="pick-card">
<div class="pick-icon">
<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<circle cx="32" cy="32" r="30" fill="#1a0d0d"/>
<circle cx="32" cy="32" r="30" stroke="#7f1d1d" stroke-width="2"/>
<path d="M18 40a14 14 0 0 1 28 0" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
<rect x="14" y="38" width="9" height="14" rx="4" fill="#ef4444"/>
<rect x="41" y="38" width="9" height="14" rx="4" fill="#ef4444"/>
<rect x="16.5" y="41" width="4" height="8" rx="2" fill="#7f1d1d"/>
<rect x="43.5" y="41" width="4" height="8" rx="2" fill="#7f1d1d"/>
<rect x="27" y="30" width="3.5" height="8" rx="1.5" fill="#f5f5f5"/>
<rect x="32" y="27" width="3.5" height="11" rx="1.5" fill="#fca5a5"/>
<rect x="37" y="31" width="3.5" height="7" rx="1.5" fill="#f5f5f5"/>
</svg>
</div>
<div class="pick-title">No episodes found</div>
<div class="pick-sub">Choose audio files to play</div>
<label class="pick-btn" for="manual">Browse files</label>
<input type="file" id="manual" accept="audio/*" multiple>
<div class="pick-count" id="pickCount"></div>
</div>
</div>
<ul id="list"></ul>
<div id="bar">
<div id="now">No track</div>
<div id="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<input type="range" id="seek" value="0" min="0" max="1000">
<div class="ctrls">
<button class="mini" id="prev">⏮</button>
<button class="mini" id="back">−5</button>
<button class="big" id="play">▶</button>
<button class="mini" id="fwd">+5</button>
<button class="mini" id="next">⏭</button>
</div>
<div class="tools">
<label>Skip <input type="number" id="seekSec" min="1" max="300" value="5">s</label>
<select id="sleep"><option value="0">Sleep: off</option><option value="15">Sleep 15m</option><option value="30">Sleep 30m</option><option value="60">Sleep 60m</option></select>
<select id="speed"><option value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
</div>
</div>
<audio id="a" preload="metadata"></audio>
<script>
const A=document.getElementById('a'),list=document.getElementById('list'),
status=document.getElementById('status'),q=document.getElementById('q'),
nowEl=document.getElementById('now'),seek=document.getElementById('seek'),
cur=document.getElementById('cur'),dur=document.getElementById('dur'),
playBtn=document.getElementById('play');
let tracks=[],idx=-1,filter='all',sleepT=null;
let seekSec=parseInt(localStorage.getItem('bhootfm_seeksec')||'5',10)||5;
let favs=JSON.parse(localStorage.getItem('bhootfm_fav')||'[]');
let state=JSON.parse(localStorage.getItem('bhootfm_state')||'{}');
let booted=false;
function fmt(s){if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function clean(n){return n.replace(/\.[a-z0-9]+$/i,'').replace(/[_-]+/g,' ').trim()}
function saveFav(){localStorage.setItem('bhootfm_fav',JSON.stringify(favs))}
function loadNative(){
  try{
    if(window.BhootFM&&BhootFM.listTracks){
      const prevUri=(idx>=0&&tracks[idx])?tracks[idx].uri:null;
      const arr=JSON.parse(BhootFM.listTracks());
      tracks=arr.map(t=>({name:t.name,title:clean(t.name),uri:t.uri,local:true}));
      const info=JSON.parse(BhootFM.getFolderInfo());
      document.getElementById('fallback').style.display=info.found&&tracks.length?'none':'flex';
      status.textContent=tracks.length?tracks.length+' episodes':'';
      if(!booted){
        booted=true;
        render();
        if(state.uri){const i=tracks.findIndex(t=>t.uri===state.uri);if(i>=0){load(i,false);A.currentTime=state.t||0;}}
      }else if(prevUri){
        // Safe re-scan (permission grant / resume): keep playing item, never reset src.
        const i=tracks.findIndex(t=>t.uri===prevUri);
        if(i>=0)idx=i; else if(idx>=tracks.length)idx=-1;
        render();
      }else{
        render();
      }
      return tracks.length>0;
    }
  }catch(e){}
  status.textContent='';
  document.getElementById('fallback').style.display='flex';
  return false;
}
window.__onStoragePermission=function(granted){if(granted===false){status.textContent='';document.getElementById('fallback').style.display='flex';return}loadNative()};
// The first scan can run before the permission grant lands — retry a few times.
function rescanUntilFound(){let n=0;const t=setInterval(()=>{if(tracks.length||n>=4){clearInterval(t);return}n++;loadNative()},900)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadNative()});
window.addEventListener('pageshow',()=>loadNative());
function render(){
  const term=q.value.toLowerCase();
  list.innerHTML='';
  const vis=tracks.map((t,i)=>({...t,i})).filter(t=>{
    if(filter==='fav'&&!favs.includes(t.uri))return false;
    return t.title.toLowerCase().includes(term);
  });
  if(!vis.length){list.innerHTML='';document.getElementById('fallback').style.display='flex';return}
  document.getElementById('fallback').style.display=tracks.length?'none':'flex';
  vis.forEach(t=>{
    const li=document.createElement('li');
    if(t.i===idx)li.className='playing';
    li.innerHTML='<div class="num">'+(t.i===idx?'♪':(t.i+1))+'</div><div class="t"><b></b><span></span></div>';
    li.querySelector('b').textContent=t.title;
    li.querySelector('span').textContent=t.name;
    const f=document.createElement('button');f.className='fav'+(favs.includes(t.uri)?' on':'');f.textContent='♥';
    f.onclick=e=>{e.stopPropagation();const k=t.uri;favs=favs.includes(k)?favs.filter(x=>x!==k):[...favs,k];saveFav();render();};
    li.appendChild(f);
    li.onclick=()=>{load(t.i,true)};
    list.appendChild(li);
  });
}
function load(i,auto){
  idx=i;const t=tracks[i];if(!t)return;
  A.src=t.uri;A.playbackRate=parseFloat(document.getElementById('speed').value||'1');
  nowEl.textContent=t.title;
  localStorage.setItem('bhootfm_state',JSON.stringify({uri:t.uri}));
  if(auto)A.play();
  render();
}
function seekBy(s){if(!A.duration)return;A.currentTime=Math.min(Math.max(0,A.currentTime+s),A.duration||0)}
function $(id){return document.getElementById(id)}
function paintSeek(){$('back').textContent='−'+seekSec;$('fwd').textContent='+'+seekSec;const inp=$('seekSec');if(inp&&inp.value!=String(seekSec))inp.value=seekSec}
function toggle(){if(!tracks.length)return;if(idx<0){load(0,true);return}if(A.paused)A.play();else A.pause()}
function step(d){
  if(!tracks.length)return;
  let n=idx+d;if(n<0)n=tracks.length-1;if(n>=tracks.length)n=0;load(n,true);
}
A.onplay=()=>playBtn.textContent='⏸';
A.onpause=()=>playBtn.textContent='▶';
A.onended=()=>{if(idx<tracks.length-1)step(1)};
A.ontimeupdate=()=>{cur.textContent=fmt(A.currentTime);dur.textContent=fmt(A.duration);if(A.duration)seek.value=A.currentTime/A.duration*1000;localStorage.setItem('bhootfm_state',JSON.stringify({uri:tracks[idx]?tracks[idx].uri:'',t:A.currentTime}))};
seek.oninput=()=>{if(A.duration)A.currentTime=seek.value/1000*A.duration};
playBtn.onclick=toggle;
document.getElementById('next').onclick=()=>step(1);
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('back').onclick=()=>seekBy(-seekSec);
document.getElementById('fwd').onclick=()=>seekBy(seekSec);
document.getElementById('seekSec').value=seekSec;
document.getElementById('seekSec').onchange=e=>{seekSec=Math.min(300,Math.max(1,parseInt(e.target.value,10)||5));localStorage.setItem('bhootfm_seeksec',String(seekSec));paintSeek()};
paintSeek();
q.oninput=render;
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});
document.getElementById('rescan').onclick=()=>{loadNative()};
document.getElementById('speed').onchange=e=>A.playbackRate=parseFloat(e.target.value);
document.getElementById('sleep').onchange=e=>{clearTimeout(sleepT);const m=parseInt(e.target.value);if(m>0){sleepT=setTimeout(()=>A.pause(),m*60000);status.textContent='Sleep timer: '+m+' min'}};
document.getElementById('manual').onchange=e=>{
  tracks=[...e.target.files].map(f=>({name:f.name,title:clean(f.name),uri:URL.createObjectURL(f),local:false}));
  document.getElementById('pickCount').textContent=tracks.length?tracks.length+' selected':'';
  status.textContent=tracks.length?tracks.length+' episodes':'';
  render();
};
if('mediaSession' in navigator){try{navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));navigator.mediaSession.setActionHandler('seekbackward',()=>seekBy(-seekSec));navigator.mediaSession.setActionHandler('seekforward',()=>seekBy(seekSec))}catch(e){}}
loadNative();
rescanUntilFound();
</script>
</body>
</html>
