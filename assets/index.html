<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Porimap — Price Calculator</title>
<style>
  :root{
    --bg:#f4f6f5; --card:#ffffff; --text:#15211d; --muted:#687d77;
    --border:#e0e9e5; --primary:#0f6a54; --primary-soft:#dff2ec; --accent:#c8a86a;
  }
  .dark{
    --bg:#0a1210; --card:#162722; --text:#e8f0ed; --muted:#8aa39d;
    --border:#1e3a32; --primary:#1a9a7d; --primary-soft:#14332c; --accent:#d9bc8a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border)}
  .bar{max-width:520px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  #themeBtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:17px;cursor:pointer}
  main{max-width:520px;margin:0 auto;padding:20px 20px 40px;display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px}
  label{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted)}
  .field{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:0 14px}
  .field span{color:var(--muted);font-weight:600;white-space:nowrap}
  input{flex:1;min-width:0;border:none;background:transparent;color:var(--text);font-size:20px;font-weight:700;padding:14px 0;outline:none}
  #calcBtn{width:100%;margin-top:16px;padding:16px;border:none;border-radius:16px;background:var(--primary);color:#fff;font-size:17px;font-weight:800;cursor:pointer}
  #calcBtn:active{transform:scale(.98)}
  #result{display:none;text-align:center;padding:8px 0 0}
  #result.show{display:block;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #priceBig{font-size:clamp(32px,10vw,52px);font-weight:800;letter-spacing:-1px;overflow-wrap:anywhere}
  #priceBig small{font-size:.55em;color:var(--muted)}
  #breakdown{margin-top:6px;font-size:14px;color:var(--muted)}
  #formula{margin-top:10px;font-size:13px;color:var(--muted);background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:10px;overflow-wrap:anywhere}
  .rowBtns{display:flex;gap:10px;margin-top:12px}
  .ghost{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:700;cursor:pointer}
  h2{font-size:15px;margin-bottom:12px}
  #hist{list-style:none;display:grid;gap:8px}
  #hist li{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  #hist li b{white-space:nowrap}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:8px}
  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);max-width:90vw;text-align:center;background:#1a2e29;color:#fff;padding:12px 22px;border-radius:99px;font-size:14px;display:none;z-index:50}
  .brand small{display:block;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:360px){
    main{padding:14px 14px 32px}
    .card{padding:16px}
    .bar{padding:0 14px}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><div class="logo">৳</div><div>Porimap<br><small style="font-weight:400;color:var(--muted)">পরিমাপ • measure the price</small></div></div>
    <button id="themeBtn" title="Toggle theme">☀️</button>
  </div>
</header>

<main>
  <div class="card">
    <label>RATE — MONEY PER KG (৳)</label>
    <div class="field"><span>৳</span><input id="rate" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 95000" /></div>
    <div style="height:14px"></div>
    <label>WEIGHT OF PRODUCT (GRAM)</label>
    <div class="field"><input id="weight" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 2.5" /><span>g</span></div>
    <button id="calcBtn">Calculate Price</button>

    <div id="result">
      <p style="font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-top:14px">TOTAL PRICE</p>
      <p id="priceBig"></p>
      <p id="breakdown"></p>
      <p id="formula"></p>
      <div class="rowBtns">
        <button class="ghost" id="copyBtn">Copy</button>
        <button class="ghost" id="clearBtn">Clear</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Recent calculations</h2>
    <ul id="hist"></ul>
  </div>
</main>

<div id="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  const store = {
    load() { try { return JSON.parse(localStorage.getItem('porimap_v2')) || {}; } catch(e){ return {}; } },
    save(d) { try { localStorage.setItem('porimap_v2', JSON.stringify(d)); } catch(e){} }
  };
  let data = Object.assign({ rate:'', theme:'light', hist:[] }, store.load());

  // Theme
  function applyTheme(){
    document.documentElement.classList.toggle('dark', data.theme === 'dark');
    $('themeBtn').textContent = data.theme === 'dark' ? '🌙' : '☀️';
  }
  $('themeBtn').onclick = () => {
    data.theme = data.theme === 'dark' ? 'light' : 'dark';
    store.save(data); applyTheme();
  };
  applyTheme();

  if (data.rate !== '') $('rate').value = data.rate;
  $('rate').addEventListener('input', e => { data.rate = e.target.value; store.save(data); });

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 1800);
  }

  function renderHist(){
    const ul = $('hist'); ul.innerHTML = '';
    if (!data.hist.length) { ul.innerHTML = '<li class="empty">No calculations yet</li>'; return; }
    data.hist.forEach(h => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${h.weight}g × ৳${h.rate}/kg</span><b>৳${h.total}</b>`;
      ul.appendChild(li);
    });
  }
  renderHist();

  let lastTotal = '';
  $('calcBtn').onclick = () => {
    const rate = parseFloat($('rate').value);
    const weight = parseFloat($('weight').value);
    if (!(rate > 0) || !(weight > 0)) { toast('Enter valid rate and weight'); return; }

    const total = Math.round((rate / 1000) * weight * 100) / 100;   // per-kg rate → gram weight
    const taka = Math.floor(total);
    const poisha = Math.round((total - taka) * 100);        // fraction of 1 taka
    lastTotal = total.toFixed(2);

    $('priceBig').innerHTML = `৳${taka}.<small>${String(poisha).padStart(2,'0')}</small>`;
    $('breakdown').textContent = `${taka} Taka and ${poisha} Poisha — .${String(poisha).padStart(2,'0')} is ${poisha}% of 1 Taka`;
    $('formula').textContent = `৳${rate}/kg × ${weight}g = ৳${lastTotal}`;
    $('result').classList.add('show');

    data.hist.unshift({ rate, weight, total: lastTotal });
    data.hist = data.hist.slice(0, 8);
    store.save(data); renderHist();
  };

  $('clearBtn').onclick = () => {
    $('weight').value = ''; $('result').classList.remove('show');
  };
  $('copyBtn').onclick = () => {
    if (!lastTotal) return;
    try { navigator.clipboard.writeText('৳' + lastTotal); toast('Copied ৳' + lastTotal); }
    catch(e){ toast('৳' + lastTotal); }
  };
</script>
</body>
</html>
