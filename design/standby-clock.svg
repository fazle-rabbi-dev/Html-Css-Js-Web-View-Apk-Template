    <circle cx="535" cy="580" r="10"/>

    <!-- 2 -->
    <path d="M575 465 H655 L675 485 V535 L655 555 H595 V595 H675 V625 H575 V545 L595 525 H645 V495 H575 Z"/>

    <!-- 4 -->
