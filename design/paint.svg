
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

  <!-- Background -->
  <rect x="80" y="80" width="864" height="864" rx="205" fill="#4169E1"/>

  <!-- Drawing canvas -->
  <g transform="rotate(-8 500 500)">
    <rect
      x="255" y="250"
      width="510" height="510"
      rx="38"
      fill="#F7F3E8"
      stroke="#17191D"
      stroke-width="25"
    />

    <!-- Creative stroke -->
    <path
      d="M355 590
         C390 470 485 430 565 495
         C615 535 650 475 690 400"
      fill="none"
      stroke="#F16B45"
      stroke-width="35"
      stroke-linecap="round"
    />

    <path
      d="M355 650
         C420 590 475 575 535 600"
      fill="none"
      stroke="#4169E1"
      stroke-width="27"
      stroke-linecap="round"
    />
  </g>

  <!-- Paintbrush -->
  <g transform="rotate(43 620 490)">

    <!-- Handle -->
    <path
      d="M572 270
         Q572 245 600 245
         L648 245
         Q676 245 676 270
         L676 590
         L572 590 Z"
      fill="#E6AE70"
      stroke="#17191D"
      stroke-width="25"
      stroke-linejoin="round"
    />

    <!-- Handle highlight -->
    <path
      d="M602 280 L602 550"
      stroke="#F8D2A0"
      stroke-width="13"
      stroke-linecap="round"
    />

    <!-- Ferrule -->
    <path
      d="M572 570
         L676 570
         L676 650
         Q624 670 572 650 Z"
      fill="#C4C9CE"
      stroke="#17191D"
      stroke-width="23"
      stroke-linejoin="round"
    />

    <!-- Ferrule detail -->
    <path
      d="M580 603 L668 603"
      stroke="#858C94"
      stroke-width="10"
    />

    <!-- Brush bristles -->
    <path
      d="M572 650
         Q624 670 676 650
         L660 745
         Q624 785 588 745 Z"
      fill="#F7F3E8"
      stroke="#17191D"
      stroke-width="23"
      stroke-linejoin="round"
    />

    <!-- Blue paint tip -->
    <path
      d="M588 725
         Q624 740 660 725
         L654 752
         Q624 778 594 752 Z"
      fill="#4169E1"
    />
  </g>

</svg>
