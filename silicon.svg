<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Blue Background Gradient (Matching the original vibe) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/> <!-- Dark Navy -->
      <stop offset="50%" stop-color="#2563EB"/> <!-- Royal Blue -->
      <stop offset="100%" stop-color="#3B82F6"/> <!-- Bright Blue -->
    </linearGradient>

    <!-- Glowing Sun Gradient -->
    <linearGradient id="sunGlow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="1"/>
    </linearGradient>

    <!-- Drop Shadow for the floating 3D look -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Soft Blur for the sun glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Rounded Base (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Inner highlight border for 3D glass effect -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>

  <!-- The Glowing Sun (Semi-circle) -->
  <path d="M 116 260 A 140 140 0 0 1 396 260 Z" fill="url(#sunGlow)" filter="url(#glow)"/>

  <!-- The Horizontal Bars (WebView Loading / Generic Content vibe) -->
  <!-- Bar 1 (Top, widest, brightest) -->
  <rect x="116" y="280" width="280" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.9"/>
  
  <!-- Bar 2 -->
  <rect x="136" y="320" width="240" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.75"/>
  
  <!-- Bar 3 -->
  <rect x="166" y="360" width="180" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.55"/>
  
  <!-- Bar 4 (Bottom, shortest, most transparent) -->
  <rect x="196" y="400" width="120" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.35"/>

</svg>