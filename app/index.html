<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bare Web Template</title>
    <script>
      // Apply the saved theme before first paint, so there is no flash.
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved
          ? saved === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">Bare Template</span>
      <button
        id="theme-toggle"
        class="icon-btn"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false"
      >
        <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
        <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      </button>
    </header>

    <main>
      <section class="card">
        <h1>Hello</h1>
        <p class="muted">
          Everything is local: <code>index.html</code>, <code>style.css</code>,
          <code>script.js</code>. No CDN, no icons to download (inline SVG only).
        </p>
        <button id="btn" class="btn" type="button">Click me</button>
        <p id="out" class="muted" role="status"></p>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
